<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;     
        }

        td {
            border: 1px solid black;
            padding: 8px;
        }

        .linha {
            background-color: rgba(0, 255, 255, 0.577);
        }

        .result {
            color: black;
            background-color: rgb(255, 255, 255);
        }

        #l3 {
            background-color: rgb(246, 255, 0);
            background-position: right;
        }

        #d1 {
            border: 0px;
            background-color: rgb(255, 255, 255);
        }

        #d2 {
            border: 0px;
            background-color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <h1>Conhecendo Tabelas</h1>

    <!-- HIERARQUIA DE TABELAS (simples)

       TABLE ROW = linha da tabela (tr)
           TABLE GEADER = cabeçalho de tabela
           TABLE DATA = dado de tabela
        Se a HIERARQUIA não for obedecida, os dados que for colocando posteriormente apareceram ou encima ou embaixo da tabela.
    -->
    <header>
        <h2>Somando o S</h1>
    </header>
    <table>
        <tr class="linha"> <!-- Primeira Linha -->
            <td>JANEIRO</td>
            <td>FEVEREIRO</td>
            <td>MARÇO</td>
        </tr>
        <tr>
            <td>1.600</td>
            <td>1.600</td>
            <td>1.600</td>
        </tr>
        <tr id="l3">
            <td id="d1"></td>
            <td id="d2"></td>
            <td><strong>TOTAL</strong></td>
            <td class="result"><strong>4.800</strong></td>
        </tr>
    </table>

    
</body>
</html>
