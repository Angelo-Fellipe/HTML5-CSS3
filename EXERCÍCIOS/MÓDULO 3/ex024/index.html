<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Conhecendo Tabelas</h1>

    <!-- HIERARQUIA DE TABELAS (simples)

       TABLE ROW = linha da tabela (tr)
           TABLE GEADER = cabeçalho de tabela
           TABLE DATA = dado de tabela
    -->
    <header>
        <h2>Somando o S</h1>
    </header>
    <table>
        <tr class="linha"> <!-- Primeira Linha -->
            <td>JANEIRO</td>
            <td>FEVEREIRO</td>
            <td>MARÇO</td>
        </tr>
        <tr>
            <td>1.600</td>
            <td>1.600</td>
            <td>1.600</td>
        </tr>
        <tr class="linha" id="l3">
            <td></td>
            <td></td>
            <td>TOTAL</td>
            <td>4.800</td>
        </tr>
    </table>

    
</body>
</html>
